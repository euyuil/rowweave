name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:sdk
        if: runner.os == 'Linux'
      - run: npm run package:cli
        if: runner.os == 'Linux'
      - run: npm run package:mcp
        if: runner.os == 'Linux'
      - run: npm run package:harness
        if: runner.os == 'Linux'
      - run: npm run test:harness
        if: runner.os == 'Windows'
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - run: npm run package:win
        if: runner.os == 'Windows'
      - run: npm run test:packaged
        if: runner.os == 'Windows'
      - run: npm run test:interfaces
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: rowweave-typescript-sdk
          path: release/sdk/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: rowweave-cli
          path: release/cli/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: rowweave-mcp
          path: release/mcp/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: rowweave-harness
          path: release/harness/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: rowweave-agent-skill
          path: skills/rowweave-tables/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: desktop-screenshots
          path: .artifacts/desktop-*.png
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: rowweave-windows
          path: |
            release/**/*.zip
            release/**/*.sha256
            release/latest.json
          retention-days: 14
